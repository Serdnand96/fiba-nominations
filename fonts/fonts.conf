<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fuentes para la conversión .docx → PDF de las cartas (LibreOffice headless).

  El droplet no trae ninguna de las tipografías que declaran las plantillas, y
  fontconfig las reemplazaba por DejaVu Sans, más ancha: títulos partidos,
  bloque de firma en cuatro líneas, footer cortado a mitad de palabra.

  document_generator._convert_to_pdf_libreoffice() exporta
  FONTCONFIG_FILE=<repo>/fonts/fonts.conf al lanzar soffice, así que este
  archivo se aplica solo a esa conversión y no depende de instalar nada en el
  sistema ni del HOME del usuario del servicio.

  - Las fuentes libres (OFL) viven en esta carpeta y se versionan.
  - `private/` está en .gitignore: ahí van las fuentes con licencia (Univers,
    Cochocib Script) si FIBA las entrega. Al estar instaladas, ganan sobre el
    sustituto porque los alias de abajo usan <accept> (se agregan DESPUÉS de la
    familia pedida), no <prefer>.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">private</dir>

  <!-- Cuerpo de GENERIC / BCLA / LSB. Univers es una grotesca suiza; Nimbus
       Sans (clon de Helvetica, viene con LibreOffice) es lo más cercano libre. -->
  <alias binding="same">
    <family>Univers</family>
    <accept><family>Nimbus Sans</family><family>IBM Plex Sans</family></accept>
  </alias>
  <!-- Univers Condensed es muy angosta: el footer de GENERIC la usa en cajas
       de texto de ancho fijo, y con Nimbus Sans Narrow "FIBA.basketball" se
       partía en dos líneas. PT Sans Narrow entra. -->
  <alias binding="same">
    <family>Univers Condensed</family>
    <accept><family>PT Sans Narrow</family><family>Nimbus Sans Narrow</family></accept>
  </alias>
  <alias binding="same">
    <family>Univers 57 Condensed</family>
    <accept><family>PT Sans Narrow</family><family>Nimbus Sans Narrow</family></accept>
  </alias>

  <!-- Firma "manuscrita" de BCLA y LSB: texto en una script comercial. -->
  <alias binding="same">
    <family>Cochocib Script Latin Pro</family>
    <accept><family>Alex Brush</family></accept>
  </alias>

  <!-- Membrete y footer de LSB / GENERIC. -->
  <alias binding="same">
    <family>Titillium Lt</family>
    <accept><family>Titillium Web</family></accept>
  </alias>
  <alias binding="same">
    <family>Titillium</family>
    <accept><family>Titillium Web</family></accept>
  </alias>
  <alias binding="same">
    <family>Neo Sans Std Light</family>
    <accept><family>IBM Plex Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>Neo Sans Std</family>
    <accept><family>IBM Plex Sans</family></accept>
  </alias>
  <alias binding="same">
    <family>DIN</family>
    <accept><family>PT Sans Narrow</family><family>IBM Plex Sans Condensed</family></accept>
  </alias>
  <!-- Fuente del tema de Word en WCQ, GENERIC y LSB: la usan las cajas de
       texto del footer ("@FIBA", "FIBA.basketball"), que tienen ancho fijo.
       Carlito tiene las mismas métricas que Calibri, así que entra igual que
       en Word. -->
  <alias binding="same">
    <family>Calibri</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Calibri Light</family>
    <accept><family>Carlito</family></accept>
  </alias>
</fontconfig>
