name: Deploy to DigitalOcean Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite disparar manualmente desde GitHub UI

# Deploy is over SSH and never uses the GITHUB_TOKEN — drop all of its scopes.
permissions: {}

# Un solo deploy a la vez: dos pushes seguidos hacían git reset --hard + npm ci
# sobre el mismo directorio en paralelo (race). No cancelar el que está en curso.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key fiba@${{ secrets.DROPLET_HOST }} 'bash -s' << 'EOF'
          set -euo pipefail
          cd /opt/fiba-nominations

          # Commit actual, para poder volver si algo sale mal.
          PREV=$(git rev-parse HEAD)
          echo "=== deploy desde $PREV ==="

          echo "=== git pull ==="
          git fetch --quiet origin main
          git reset --hard origin/main

          echo "=== Python deps ==="
          # requirements.txt now pins the server deps (gunicorn/uvicorn/supabase)
          # too, so a single install keeps every version within its bounds.
          ./venv/bin/pip install -r requirements.txt -q

          echo "=== Frontend build (a dist.new, sin tocar el dist en vivo) ==="
          set -a && . ./.env && set +a
          npm ci --silent --no-audit --no-fund
          # Build a un directorio aparte y recién ahí hacer el swap: nginx sirve
          # /opt/fiba-nominations/dist, y vite lo vaciaba al empezar → 404 en
          # index.html y assets durante todo el build.
          rm -rf dist.new
          npm run build -- --outDir dist.new --emptyOutDir
          rm -rf dist.old
          [ -d dist ] && mv dist dist.old
          mv dist.new dist   # swap ~atómico (mismo filesystem)

          echo "=== Restart API ==="
          sudo systemctl restart fiba-api
          sleep 2
          sudo systemctl is-active fiba-api

          echo "=== Smoke test ==="
          if curl -fsS -o /dev/null -w "HTTPS %{http_code}\n" https://www.fibaapp.com/; then
            echo "✅ Deploy OK"
            rm -rf dist.old
          else
            echo "❌ Smoke test falló — rollback a $PREV"
            # Restaurar el frontend anterior de inmediato.
            rm -rf dist.failed && mv dist dist.failed || true
            [ -d dist.old ] && mv dist.old dist
            # Revertir el código y las deps al commit previo, y reiniciar.
            git reset --hard "$PREV"
            ./venv/bin/pip install -r requirements.txt -q
            sudo systemctl restart fiba-api
            sleep 2
            sudo systemctl is-active fiba-api
            echo "↩️  Rollback aplicado. El workflow queda en rojo."
            exit 1
          fi
          EOF
