# Proyecto de Xcode generado con XcodeGen: el .xcodeproj NO se commitea.
#   brew install xcodegen && cd ios && xcodegen generate && open FIBAAmericas.xcodeproj
name: FIBAAmericas
options:
  bundleIdPrefix: com.fibaapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  FIBAAmericas:
    type: application
    platform: iOS
    sources:
      - path: FIBAAmericas
      # Las mismas fuentes que usan las cartas (punto 20 de CLAUDE.md): no se duplican.
      - path: ../fonts/IBMPlexSans-Regular.ttf
        buildPhase: resources
      - path: ../fonts/IBMPlexSans-Medium.ttf
        buildPhase: resources
      - path: ../fonts/IBMPlexSans-SemiBold.ttf
        buildPhase: resources
      - path: ../fonts/IBMPlexSans-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: FIBA Americas
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Para elegir tu foto de perfil.
        # Vienen de Config/*.xcconfig (ver ios/README.md).
        API_BASE_URL: $(API_BASE_URL)
        WEB_BASE_URL: $(WEB_BASE_URL)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fibaapp.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  FIBAAmericasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FIBAAmericasTests
    dependencies:
      - target: FIBAAmericas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FIBAAmericas:
    build:
      targets:
        FIBAAmericas: all
        FIBAAmericasTests: [test]
    test:
      targets:
        - FIBAAmericasTests
